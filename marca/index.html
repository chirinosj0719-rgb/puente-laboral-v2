<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agéndalo · Marca</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#17110D;--cream:#F4ECE3;--paper:#FAF7F2;--line:#E6DDD2;--muted:#7A6F66;--acc:#FF5A1F}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 "Google Sans Flex",system-ui,sans-serif}
  header{padding:56px clamp(20px,5vw,72px) 36px;border-bottom:1px solid var(--line)}
  header img{height:84px}
  section{padding:40px clamp(20px,5vw,72px);border-bottom:1px solid var(--line)}
  h2{margin:0 0 20px;font-size:1.4rem;font-weight:600;letter-spacing:-.03em}
  .row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:32px}
  figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
  figcaption{font-size:.8rem;color:var(--muted)}
  .ic{width:160px;height:160px;filter:drop-shadow(0 18px 28px rgba(23,17,13,.16))}
  .tile{display:grid;place-items:center;padding:32px 40px;border-radius:24px;border:1px solid var(--line);background:#fff}
  .tile.dk{background:var(--ink);border-color:var(--ink)}
  .tile.or{background:var(--acc);border-color:var(--acc)}
  .sw{display:flex;gap:12px}
  .sw span{display:flex;flex-direction:column;justify-content:flex-end;width:150px;height:110px;padding:12px;border-radius:18px;font-size:.82rem;border:1px solid var(--line)}
  code{font-size:.85rem}
</style>
</head>
<body>
  <header><img src="agendalo-logo.svg" alt="Agéndalo"></header>
  <section><h2>Símbolo</h2><div class="row">
    <figure class="tile"><img src="agendalo-simbolo.svg" width="180" alt=""><figcaption>agendalo-simbolo.svg</figcaption></figure>
    <figure class="tile dk"><img src="agendalo-simbolo-claro.svg" width="180" alt=""><figcaption style="color:#CDBFB4">agendalo-simbolo-claro.svg</figcaption></figure>
    <figure class="tile"><img src="agendalo-simbolo-naranja.svg" width="180" alt=""><figcaption>agendalo-simbolo-naranja.svg</figcaption></figure>
  </div></section>
  <section><h2>Ícono de app</h2><div class="row">
    <figure><img class="ic" src="agendalo-icono-naranja.svg" alt=""><figcaption>Naranja · principal</figcaption></figure>
    <figure><img class="ic" src="agendalo-icono-oscuro.svg" alt=""><figcaption>Oscuro</figcaption></figure>
    <figure><img class="ic" src="agendalo-icono-claro.svg" alt=""><figcaption>Claro</figcaption></figure>
    <figure><img src="agendalo-icono-512.png" width="64" alt=""><figcaption>64 px</figcaption></figure>
    <figure><img src="favicon-32.png" width="32" alt=""><figcaption>32 px</figcaption></figure>
    <figure><img src="favicon-16.png" width="16" alt=""><figcaption>16 px</figcaption></figure>
  </div></section>
  <section><h2>Logo</h2><div class="row">
    <figure class="tile"><img src="agendalo-logo.svg" height="70" alt=""></figure>
    <figure class="tile dk"><img src="agendalo-logo-claro.svg" height="70" alt=""></figure>
  </div></section>
  <section><h2>Colores</h2><div class="sw">
    <span style="background:#FF5A1F;color:#fff;border-color:#FF5A1F"><b>Naranja</b><code>#FF5A1F</code></span>
    <span style="background:#17110D;color:#F4ECE3;border-color:#17110D"><b>Tinta</b><code>#17110D</code></span>
    <span style="background:#F4ECE3"><b>Crema</b><code>#F4ECE3</code></span>
    <span style="background:#FAF7F2"><b>Papel</b><code>#FAF7F2</code></span>
  </div></section>
  <section><h2>Archivos</h2><p class="muted">SVG para web e impresión · PNG del ícono en 1024, 512 y 180 (apple-touch-icon) · favicon en SVG, ICO, 32 y 16 px · logo en PNG con la tipografía ya dibujada.</p></section>
</body>
</html>
